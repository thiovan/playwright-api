services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "8080:8080"
    volumes:
      - ./recordings:/app/recordings
    environment:
      - PORT=3000
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_TLS=false
      - CONCURRENCY=3
      - ACTION_TIMEOUT=60000
      - WORKFLOW_TIMEOUT=300000
      - WEBHOOK_TIMEOUT=30000
      - HISTORY_TTL=86400
      - HISTORY_MAX_ITEMS=1000
      - VNC_HOST=localhost
      - VNC_PORT=8080
      - DISPLAY=:99
      - RECORDINGS_DIR=/app/recordings
      - RECORDINGS_TTL=86400
      - DASHBOARD_DEFAULT_USERNAME=admin
      - DASHBOARD_DEFAULT_PASSWORD=admin
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  redis-data:
