openapi: "3.0.3"

info:
  title: Playwright API Automation Engine
  description: |
    Enterprise-grade JSON workflow-driven browser automation API powered by Playwright.
    Features modern Shadcn UI dashboard, synchronous and asynchronous execution (BullMQ),
    drag-and-drop workflow builder, API key management, template library, cron scheduler,
    debugging screen recordings (.webm), and remote browser visual inspection (noVNC).
  version: "1.1.0"
  contact:
    name: Playwright API Team
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: Local Docker / Dev Environment

tags:
  - name: Health
    description: Server health & telemetry monitoring
  - name: Execution
    description: Synchronous & asynchronous workflow execution
  - name: Recordings
    description: Screen recording artifacts (.webm)
  - name: Dashboard Auth
    description: Dashboard administrator authentication & session management
  - name: Dashboard Analytics
    description: Queue telemetry, metrics, and execution history
  - name: Dashboard Keys
    description: API Key lifecycle management for external integrations
  - name: Dashboard Templates
    description: Pre-configured and custom workflow templates
  - name: Dashboard Schedules
    description: Cron and interval-based recurring workflow jobs
  - name: Dashboard Setup
    description: Redis connection and environment configuration

paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Health Check
      description: Returns current server status, timestamp, uptime, and database connectivity.
      operationId: healthCheck
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/sync:
    post:
      tags: [Execution]
      summary: Synchronous Workflow Execution
      description: |
        Executes a browser workflow synchronously. The HTTP connection remains open until
        completion. If API keys are configured, provide the key via `x-api-key` header.
      operationId: syncExecution
      security:
        - {}
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowPayload"
      responses:
        "200":
          description: Workflow executed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized (Invalid or missing API key when required)
        "400":
          description: Validation error in workflow payload
        "422":
          description: Workflow execution failed at a specific step
        "500":
          description: Internal server error

  /api/v1/async:
    post:
      tags: [Execution]
      summary: Asynchronous Workflow Execution (BullMQ Queue)
      description: |
        Enqueues a workflow for asynchronous execution. Returns a BullMQ job ID immediately.
        Results are posted to `webhook_url` upon completion.
      operationId: asyncExecution
      security:
        - {}
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AsyncWorkflowPayload"
      responses:
        "202":
          description: Workflow queued successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAcceptedResponse"
        "401":
          description: Unauthorized
        "400":
          description: Missing or invalid webhook_url / payload

  /api/v1/recordings/{filename}:
    get:
      tags: [Recordings]
      summary: Stream or Download Screen Recording
      description: Serves WebM screen recording video files captured during workflow execution.
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
          example: "rec_1730419200000.webm"
      responses:
        "200":
          description: Video stream (.webm)
          content:
            video/webm:
              schema:
                type: string
                format: binary
        "404":
          description: Recording not found

  # ── Dashboard Auth Endpoints ───────────────────────────────────────────────
  /api/v1/dashboard/auth/login:
    post:
      tags: [Dashboard Auth]
      summary: Dashboard Admin Login
      description: Authenticates admin credentials and returns a Bearer session token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: admin
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  token: { type: string, example: "agt_1a2b3c4d5e6f" }
                  user:
                    type: object
                    properties:
                      username: { type: string, example: "admin" }
                      isDefault: { type: boolean, example: true }
        "401":
          description: Invalid username or password

  /api/v1/dashboard/auth/status:
    get:
      tags: [Dashboard Auth]
      summary: Check Auth Session Status
      responses:
        "200":
          description: Current authentication status
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: { type: boolean }
                  user: { type: object }

  /api/v1/dashboard/auth/logout:
    post:
      tags: [Dashboard Auth]
      summary: Revoke Session Token
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Successfully logged out

  # ── Dashboard Telemetry & History ──────────────────────────────────────────
  /api/v1/dashboard/stats:
    get:
      tags: [Dashboard Analytics]
      summary: Telemetry Stats & Queue Counts
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Aggregate statistics

  /api/v1/dashboard/history:
    get:
      tags: [Dashboard Analytics]
      summary: Paginated Execution History
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated request items

  /api/v1/dashboard/history/{id}:
    get:
      tags: [Dashboard Analytics]
      summary: Execution Trace & Video Details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detailed trace, results, and recording URL

  # ── API Key Management ────────────────────────────────────────────────────
  /api/v1/dashboard/keys:
    get:
      tags: [Dashboard Keys]
      summary: List API Keys
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of registered keys
    post:
      tags: [Dashboard Keys]
      summary: Generate New API Key
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "201":
          description: Newly generated API key (raw token revealed once)

  # ── Template Library ──────────────────────────────────────────────────────
  /api/v1/dashboard/templates:
    get:
      tags: [Dashboard Templates]
      summary: List Workflow Templates
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Array of workflow templates
    post:
      tags: [Dashboard Templates]
      summary: Save or Update Template
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Template saved

  # ── Scheduled Workflows ───────────────────────────────────────────────────
  /api/v1/dashboard/schedules:
    get:
      tags: [Dashboard Schedules]
      summary: List Active Cron Schedules
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of scheduled recurring workflows
    post:
      tags: [Dashboard Schedules]
      summary: Create Scheduled Workflow Job
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Schedule registered

  # ── Setup & Diagnostics ───────────────────────────────────────────────────
  /api/v1/dashboard/setup/status:
    get:
      tags: [Dashboard Setup]
      summary: Get Infrastructure Status
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Server and Redis telemetry

  /api/v1/dashboard/vnc:
    get:
      tags: [Dashboard Setup]
      summary: Probe noVNC Connection Status
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Status of port 8080 and live stream URL

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API Key authentication for external integrations
    BearerAuth:
      type: http
      scheme: bearer
      description: Session Bearer token for dashboard management endpoints

  schemas:
    BrowserConfig:
      type: object
      properties:
        headless:
          type: boolean
          description: Run browser in headless mode
          default: true
        recordVideo:
          type: boolean
          description: Enable WebM video screen recording for debugging (auto-enabled when headless=false)
          default: false
        noMedia:
          type: boolean
          description: Abort image/media/font downloads to maximize execution speed
          default: false
        debug:
          type: boolean
          description: Include verbose step logs and internal variables in response
          default: true
        viewport:
          type: object
          properties:
            width: { type: integer, default: 1280 }
            height: { type: integer, default: 720 }
        userAgent:
          type: string
        proxy:
          type: object
          properties:
            server: { type: string }
            username: { type: string }
            password: { type: string }

    WorkflowAction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          description: Automation command
          enum:
            - goto
            - close
            - click
            - dblclick
            - type
            - select
            - check
            - uncheck
            - hover
            - drag
            - upload
            - screenshot
            - eval
            - press
            - keydown
            - keyup
            - mousewheel
            - cookie-set
            - cookie-get
            - wait
            - wait-for
            - get-text
            - get-attribute
            - var-set
            - var-get
            - if
            - loop
            - loop-elements
            - dialog-dismiss
            - dialog-accept
        selector:
          type: string
          example: "#submit-button"
        value:
          description: Action payload value (string, integer, JS expression)
        name:
          type: string
          description: Variable or cookie name
        push:
          type: boolean
          description: If true, appends variable into an array instead of overwriting
        dx:
          type: number
        dy:
          type: number

    WorkflowPayload:
      type: object
      required: [workflow]
      properties:
        config:
          $ref: "#/components/schemas/BrowserConfig"
        workflow:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/WorkflowAction"

    AsyncWorkflowPayload:
      type: object
      required: [workflow, webhook_url]
      properties:
        config:
          $ref: "#/components/schemas/BrowserConfig"
        webhook_url:
          type: string
          format: uri
        workflow:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/WorkflowAction"

    HealthResponse:
      type: object
      properties:
        status: { type: string, example: "ok" }
        timestamp: { type: string, format: date-time }
        uptime: { type: number }

    StepResult:
      type: object
      properties:
        action: { type: string }
        index: { type: integer }
        data: { type: object, nullable: true }
        error: { type: string }

    SuccessResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        duration: { type: number }
        variables: { type: object }
        results:
          type: array
          items:
            $ref: "#/components/schemas/StepResult"
        recording:
          type: object
          properties:
            filename: { type: string }
            url: { type: string }

    AsyncAcceptedResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "Workflow queued for execution." }
        jobId: { type: string }
